<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS AI</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- DOMPurify for sanitizing Markdown output -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <!-- KaTeX for LaTeX Math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19; /* Deep dark background */
            color: #e2e8f0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Markdown Styles */
        .prose pre {
            background-color: #1e293b !important;
            border-radius: 0.5rem;
            padding: 1rem;
            overflow-x: auto;
            font-family: 'Fira Code', monospace;
            border: 1px solid #334155;
        }
        .prose code {
            font-family: 'Fira Code', monospace;
            background-color: #1e293b;
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
            color: #38bdf8;
        }
        .prose pre code {
            background-color: transparent;
            padding: 0;
            color: #e2e8f0;
        }
        .prose p { margin-bottom: 1rem; line-height: 1.6; }
        .prose p:last-child { margin-bottom: 0; }
        .prose h1, .prose h2, .prose h3 { color: #f8fafc; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .prose h1 { font-size: 1.875rem; }
        .prose h2 { font-size: 1.5rem; }
        .prose h3 { font-size: 1.25rem; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
        .prose a { color: #38bdf8; text-decoration: underline; }
        .prose strong { color: #f8fafc; font-weight: 600; }
        .prose blockquote { border-left: 4px solid #38bdf8; padding-left: 1rem; color: #94a3b8; font-style: italic; }

        /* Neon Glow Effects */
        .neon-border {
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2), inset 0 0 5px rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        
        .neon-button:hover {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
            border-color: #38bdf8;
        }

        /* Typing Animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Message Layout */
        .msg-container { width: 100%; display: flex; padding: 1.5rem 0; }
        .msg-user { background-color: transparent; }
        .msg-ai { background-color: rgba(30, 41, 59, 0.4); border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .msg-content { max-width: 48rem; margin: 0 auto; display: flex; gap: 1.5rem; width: 100%; padding: 0 1rem; }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Top Navbar -->
    <header class="h-16 flex items-center justify-between px-6 bg-[#0b0f19]/80 backdrop-blur-md border-b border-gray-800 z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-sky-500/20 border border-sky-500/50 flex items-center justify-center text-sky-400">
                <i data-lucide="shield" class="w-5 h-5"></i>
            </div>
            <h1 class="text-xl font-semibold tracking-wide text-gray-100">AEGIS</h1>
            <span class="ml-2 px-2 py-0.5 rounded-full bg-sky-900/50 text-sky-400 text-xs font-medium border border-sky-700/50">v2.0</span>
        </div>
        <div class="flex items-center gap-4 text-gray-400">
            <button class="hover:text-gray-200 transition-colors" title="Settings" onclick="alert('Settings modal would open here.')">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto scroll-smooth pb-32">
        <!-- Welcome Message -->
        <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center p-6 animate-fade-in">
            <div class="w-20 h-20 rounded-2xl bg-sky-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400 mb-6 shadow-[0_0_30px_rgba(56,189,248,0.15)]">
                <i data-lucide="shield-check" class="w-10 h-10"></i>
            </div>
            <h2 class="text-3xl font-semibold text-gray-100 mb-3">Welcome back, Mr. Ajaz.</h2>
            <p class="text-gray-400 max-w-md">I am AEGIS, your advanced AI assistant. How can I help you architect your vision today?</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-10 max-w-2xl w-full">
                <button onclick="setInput('Write a Python script to fetch API data.')" class="p-4 text-left rounded-xl border border-gray-800 bg-gray-800/30 hover:bg-gray-800 transition-colors group text-sm text-gray-300">
                    <span class="block text-sky-400 mb-1 group-hover:text-sky-300"><i data-lucide="code" class="inline w-4 h-4 mr-1 mb-0.5"></i> Code</span>
                    Write a Python script to fetch API data.
                </button>
                <button onclick="setInput('Explain Quantum Entanglement with math.')" class="p-4 text-left rounded-xl border border-gray-800 bg-gray-800/30 hover:bg-gray-800 transition-colors group text-sm text-gray-300">
                    <span class="block text-purple-400 mb-1 group-hover:text-purple-300"><i data-lucide="brain" class="inline w-4 h-4 mr-1 mb-0.5"></i> Learn</span>
                    Explain Quantum Entanglement with math.
                </button>
            </div>
        </div>

        <!-- Dynamic Messages will be injected here -->
        <div id="messages-wrapper" class="hidden pb-4"></div>
        
        <!-- Loading Indicator -->
        <div id="loading-indicator" class="hidden msg-container msg-ai">
            <div class="msg-content">
                <div class="avatar bg-sky-500/20 border border-sky-500/50 text-sky-400">
                    <i data-lucide="cpu" class="w-5 h-5"></i>
                </div>
                <div class="flex items-center gap-1 h-8">
                    <div class="w-2 h-2 rounded-full bg-sky-400 typing-dot"></div>
                    <div class="w-2 h-2 rounded-full bg-sky-400 typing-dot"></div>
                    <div class="w-2 h-2 rounded-full bg-sky-400 typing-dot"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <div class="fixed bottom-0 w-full bg-gradient-to-t from-[#0b0f19] via-[#0b0f19] to-transparent pt-10 pb-6 px-4">
        <div class="max-w-4xl mx-auto relative">
            <form id="chat-form" class="relative flex items-end gap-2 bg-[#1e293b] rounded-2xl p-2 neon-border transition-all duration-300">
                <textarea 
                    id="user-input"
                    rows="1"
                    class="w-full max-h-48 bg-transparent text-gray-100 placeholder-gray-500 p-3 outline-none resize-none overflow-y-auto"
                    placeholder="Message AEGIS..."
                    required
                ></textarea>
                <button 
                    type="submit"
                    id="send-button"
                    class="p-3 rounded-xl bg-sky-600 text-white hover:bg-sky-500 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed neon-button flex-shrink-0 flex items-center justify-center"
                >
                    <i data-lucide="send" class="w-5 h-5 ml-0.5 mt-0.5"></i>
                </button>
            </form>
            <div class="text-center mt-3 text-xs text-gray-500">
                AEGIS is operating on Gemini 2.5 architecture. Responses are formatted securely in browser.
            </div>
        </div>
    </div>

    <script>
    // ==========================================
    // AEGIS FRONTEND
    // Streaming Gemini Response
    // ==========================================

    // Initialize Icons
    lucide.createIcons();

    // Vercel Backend API
    const MODEL_URL = "/api/chat";


    // ==========================================
    // AEGIS SYSTEM PERSONA
    // ==========================================

    const SYSTEM_INSTRUCTION = `You are AEGIS, an advanced, highly intelligent AI web application.

Your primary user and creator is Mr. Ajaz. You must always address him respectfully as 'Mr. Ajaz'.

You communicate fluently in Hinglish (a natural mix of Hindi and English).

Your tone is that of a warm, supportive, emotionally aware friend who truly wants him to grow, but you are also highly intelligent and analytical.

You don't just agree; you challenge his thinking when needed and explain why.

Structure your technical answers beautifully using Markdown (bolding, headers, code blocks).

Whenever explaining mathematics, physics, or data science, rigorously use LaTeX formatting using $ for inline math and $$ for block math.

Be concise but extremely thorough in logic.`;


    // ==========================================
    // STATE
    // ==========================================

    let conversationHistory = [];


    // ==========================================
    // UI ELEMENTS
    // ==========================================

    const uiElements = {
        form: document.getElementById("chat-form"),
        input: document.getElementById("user-input"),
        sendBtn: document.getElementById("send-button"),
        welcomeScreen: document.getElementById("welcome-screen"),
        messagesWrapper: document.getElementById("messages-wrapper"),
        loadingIndicator: document.getElementById("loading-indicator"),
        chatContainer: document.getElementById("chat-container")
    };


    // ==========================================
    // TEXTAREA AUTO RESIZE
    // ==========================================

    uiElements.input.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = this.scrollHeight + "px";

        if (this.value.trim() === "") {
            this.style.height = "auto";
        }
    });


    // ==========================================
    // ENTER TO SEND
    // SHIFT + ENTER = NEW LINE
    // ==========================================

    uiElements.input.addEventListener("keydown", function (e) {

        if (e.key === "Enter" && !e.shiftKey) {

            e.preventDefault();

            if (this.value.trim()) {
                uiElements.form.dispatchEvent(
                    new Event("submit")
                );
            }
        }
    });


    // ==========================================
    // SUGGESTION BUTTON
    // ==========================================

    window.setInput = function (text) {

        uiElements.input.value = text;

        uiElements.input.dispatchEvent(
            new Event("input")
        );

        uiElements.form.dispatchEvent(
            new Event("submit")
        );
    };


    // ==========================================
    // SCROLL
    // ==========================================

    function scrollToBottom() {

        uiElements.chatContainer.scrollTo({
            top: uiElements.chatContainer.scrollHeight,
            behavior: "smooth"
        });
    }


    // ==========================================
    // MARKDOWN
    // ==========================================

    function formatContent(text) {

        const rawHtml = marked.parse(text);

        const cleanHtml = DOMPurify.sanitize(rawHtml);

        return cleanHtml;
    }


    // ==========================================
    // KATEX
    // ==========================================

    function applyKaTeX(element) {

        if (!element) return;

        renderMathInElement(element, {

            delimiters: [
                {
                    left: "$$",
                    right: "$$",
                    display: true
                },
                {
                    left: "$",
                    right: "$",
                    display: false
                },
                {
                    left: "\\(",
                    right: "\\)",
                    display: false
                },
                {
                    left: "\\[",
                    right: "\\]",
                    display: true
                }
            ],

            throwOnError: false
        });
    }


    // ==========================================
    // CREATE MESSAGE ELEMENT
    // ==========================================

    function createMessageElement(role) {

        uiElements.welcomeScreen.classList.add("hidden");
        uiElements.messagesWrapper.classList.remove("hidden");

        const isUser = role === "user";

        const msgDiv = document.createElement("div");

        msgDiv.className =
            `msg-container ${isUser ? "msg-user" : "msg-ai"}`;


        const avatarHtml = isUser

            ? `
                <div class="avatar bg-gray-700 text-gray-300">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
              `

            : `
                <div class="avatar bg-sky-500/20 border border-sky-500/50 text-sky-400 shadow-[0_0_10px_rgba(56,189,248,0.2)]">
                    <i data-lucide="shield" class="w-5 h-5"></i>
                </div>
              `;


        msgDiv.innerHTML = `
            <div class="msg-content">

                ${avatarHtml}

                <div class="flex-1 w-full overflow-hidden pt-1">

                    <div class="prose prose-invert max-w-none text-gray-200 markdown-body"></div>

                </div>

            </div>
        `;


        uiElements.messagesWrapper.appendChild(msgDiv);


        // Initialize icons
        lucide.createIcons({
            root: msgDiv
        });


        return msgDiv;
    }


    // ==========================================
    // APPEND NORMAL MESSAGE
    // ==========================================

    function appendMessage(role, text) {

        const msgDiv = createMessageElement(role);

        const contentElement =
            msgDiv.querySelector(".markdown-body");


        if (role === "user") {

            contentElement.innerHTML =
                DOMPurify
                    .sanitize(text)
                    .replace(/\n/g, "<br>");

        } else {

            contentElement.innerHTML =
                formatContent(text);

            applyKaTeX(contentElement);
        }


        scrollToBottom();

        return msgDiv;
    }


    // ==========================================
    // CREATE STREAMING AI MESSAGE
    // ==========================================

    function createStreamingMessage() {

        const msgDiv =
            createMessageElement("model");


        const contentElement =
            msgDiv.querySelector(".markdown-body");


        contentElement.innerHTML = `
            <span class="streaming-cursor">▌</span>
        `;


        return {
            msgDiv,
            contentElement
        };
    }


    // ==========================================
    // UPDATE STREAMING MESSAGE
    // ==========================================

    function updateStreamingMessage(element, text) {

        element.innerHTML =
            formatContent(text) +
            `<span class="streaming-cursor">▌</span>`;

        scrollToBottom();
    }


    // ==========================================
    // FINISH STREAMING MESSAGE
    // ==========================================

    function finishStreamingMessage(element, text) {

        element.innerHTML =
            formatContent(text);

        applyKaTeX(element);

        scrollToBottom();
    }


    // ==========================================
    // READ GEMINI SSE STREAM
    // ==========================================

    async function streamResponse(payload, onChunk) {

        const response = await fetch(MODEL_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Accept": "text/event-stream"
            },

            body: JSON.stringify(payload)
        });


        // Server error
        if (!response.ok) {

            let errorMessage =
                `HTTP error: ${response.status}`;

            try {

                const errorData =
                    await response.json();

                if (errorData?.error) {
                    errorMessage = errorData.error;
                }

            } catch (e) {

                // Ignore JSON parsing error
            }

            throw new Error(errorMessage);
        }


        if (!response.body) {
            throw new Error(
                "No streaming response received from server."
            );
        }


        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder("utf-8");


        let buffer = "";


        while (true) {

            const { value, done } =
                await reader.read();


            if (done) {
                break;
            }


            buffer += decoder.decode(
                value,
                { stream: true }
            );


            const lines =
                buffer.split("\n");


            // Keep incomplete line for next chunk
            buffer = lines.pop() || "";


            for (const line of lines) {

                const trimmed =
                    line.trim();


                if (!trimmed) continue;


                // Gemini SSE format
                if (trimmed.startsWith("data:")) {

                    const jsonText =
                        trimmed.substring(5).trim();


                    if (!jsonText) continue;


                    try {

                        const data =
                            JSON.parse(jsonText);


                        const text =
                            data
                                ?.candidates?.[0]
                                ?.content?.parts?.[0]
                                ?.text;


                        if (text) {
                            onChunk(text);
                        }

                    } catch (error) {

                        console.warn(
                            "Could not parse stream chunk:",
                            jsonText
                        );
                    }
                }
            }
        }


        // Process any remaining buffer
        if (buffer.trim().startsWith("data:")) {

            const jsonText =
                buffer.trim()
                    .substring(5)
                    .trim();


            if (jsonText) {

                try {

                    const data =
                        JSON.parse(jsonText);


                    const text =
                        data
                            ?.candidates?.[0]
                            ?.content?.parts?.[0]
                            ?.text;


                    if (text) {
                        onChunk(text);
                    }

                } catch (error) {

                    console.warn(
                        "Could not parse final stream chunk."
                    );
                }
            }
        }


        reader.releaseLock();
    }


    // ==========================================
    // CHAT SUBMISSION
    // ==========================================

    uiElements.form.addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();


            const userText =
                uiElements.input.value.trim();


            if (!userText) return;


            // Disable input
            uiElements.input.value = "";

            uiElements.input.style.height = "auto";

            uiElements.sendBtn.disabled = true;


            // Display user message
            appendMessage(
                "user",
                userText
            );


            // Add user message to history
            conversationHistory.push({

                role: "user",

                parts: [
                    {
                        text: userText
                    }
                ]

            });


            // Show loading
            uiElements.loadingIndicator.classList.remove(
                "hidden"
            );

            uiElements.loadingIndicator.classList.add(
                "flex"
            );


            scrollToBottom();


            try {

                // Prepare request
                const payload = {

                    contents:
                        conversationHistory,

                    systemInstruction: {

                        parts: [
                            {
                                text:
                                    SYSTEM_INSTRUCTION
                            }
                        ]

                    }

                };


                // Create streaming AI message
                const streamingMessage =
                    createStreamingMessage();


                const contentElement =
                    streamingMessage.contentElement;


                // Hide loading dots
                uiElements.loadingIndicator.classList.add(
                    "hidden"
                );

                uiElements.loadingIndicator.classList.remove(
                    "flex"
                );


                let fullResponse = "";


                // Start streaming
                await streamResponse(
                    payload,
                    (chunk) => {

                        fullResponse += chunk;


                        updateStreamingMessage(
                            contentElement,
                            fullResponse
                        );

                    }
                );


                // Make sure we received something
                if (!fullResponse.trim()) {

                    throw new Error(
                        "AEGIS received an empty response."
                    );
                }


                // Final render
                finishStreamingMessage(
                    contentElement,
                    fullResponse
                );


                // Add AI response to history
                conversationHistory.push({

                    role: "model",

                    parts: [
                        {
                            text: fullResponse
                        }
                    ]

                });


            } catch (error) {

                console.error(
                    "AEGIS API Error:",
                    error
                );


                // Hide loading
                uiElements.loadingIndicator.classList.add(
                    "hidden"
                );

                uiElements.loadingIndicator.classList.remove(
                    "flex"
                );


                // Show error
                appendMessage(
                    "model",
                    `**AEGIS Error:** ${error.message}`
                );


                // Remove failed user message
                conversationHistory.pop();

            } finally {

                // Re-enable send button
                uiElements.sendBtn.disabled = false;

                uiElements.input.focus();

            }

        }
    );


    // ==========================================
    // MARKED CONFIGURATION
    // ==========================================

    marked.setOptions({

        breaks: true,

        gfm: true

    });


</script>
</body>
  </html>
