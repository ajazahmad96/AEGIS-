<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>AEGIS</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0A0A0C',
                        surface: '#151517',
                        surface2: '#1E1E21',
                        hairline: '#28282B',
                        ink: '#F2F2F0',
                        muted: '#8E8E93',
                        accent: '#C9A66B',
                        accentDim: '#9C825A',
                        danger: '#FF453A',
                        success: '#32D74B'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'Inter', 'sans-serif'],
                        mono: ['"SF Mono"', '"Fira Code"', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Marked.js (Markdown parsing) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- DOMPurify (Security) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <!-- KaTeX (Math rendering) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Highlight.js (Syntax Highlighting) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Google Fonts (fallback for non-Apple devices) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", 'Inter', sans-serif;
            background-color: #0A0A0C;
            color: #F2F2F0;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #28282B; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3A3A3D; }

        /* Prose / Markdown Styling */
        .prose pre { margin: 0 !important; padding: 0 !important; background: transparent !important; }
        .prose p { margin-bottom: 1rem; line-height: 1.7; }
        .prose p:last-child { margin-bottom: 0; }
        .prose h1, .prose h2, .prose h3 { color: #F2F2F0; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
        .prose li { margin-bottom: 0.5rem; }
        .prose a { color: #C9A66B; text-decoration: underline; text-underline-offset: 2px; }
        .prose strong { color: #F2F2F0; font-weight: 600; }
        .prose blockquote { border-left: 2px solid #C9A66B; padding-left: 1rem; color: #8E8E93; font-style: italic; }
        .prose :not(pre) > code {
            font-family: 'SF Mono', 'Fira Code', monospace;
            background-color: #1E1E21;
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.85em;
            color: #C9A66B;
        }

        /* Table Styling */
        .prose table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.9em; overflow-x: auto; display: block; }
        .prose th, .prose td { border: 1px solid #28282B; padding: 0.7rem 1rem; text-align: left; }
        .prose th { background-color: #1E1E21; color: #F2F2F0; font-weight: 600; }
        .prose tr:nth-child(even) { background-color: rgba(255,255,255,0.015); }

        /* Input Area — calm hairline, warms on focus */
        .input-shell {
            border: 1px solid #28282B;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
            transition: border-color 0.25s ease;
        }
        .input-shell:focus-within {
            border-color: rgba(201, 166, 107, 0.45);
        }

        /* Message Layout */
        .msg-container { width: 100%; padding: 1.1rem 0; }
        .msg-content { max-width: 46rem; margin: 0 auto; padding: 0 1.25rem; position: relative; }

        /* User message: right-aligned bubble, Apple Messages inspired */
        .msg-user .msg-content { display: flex; flex-direction: column; align-items: flex-end; }
        .msg-user .bubble {
            background: #1E1E21;
            border-radius: 20px 20px 4px 20px;
            padding: 0.7rem 1.1rem;
            max-width: 85%;
        }

        /* AI message: plain, full-width, no heavy band */
        .msg-ai .msg-content { display: flex; flex-direction: column; }

        .sender-name { font-size: 0.78rem; font-weight: 600; margin-bottom: 0.4rem; letter-spacing: 0.01em; }
        .sender-ai { color: #C9A66B; }

        .msg-actions { opacity: 0; transition: opacity 0.2s; display: flex; gap: 0.25rem; margin-top: 0.6rem; }
        .msg-container:hover .msg-actions { opacity: 1; }
        @media (hover: none) { .msg-actions { opacity: 1; } }

        /* Thinking Animation */
        .thinking-pulse { animation: pulse-opacity 1.5s infinite ease-in-out; }
        @keyframes pulse-opacity {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.9; }
        }

        /* Sidebar Transitions */
        #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #sidebar-overlay { transition: opacity 0.3s ease-in-out; }

        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-base">

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/70 z-40 hidden opacity-0" onclick="toggleSidebar()"></div>

    <!-- History Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-base border-r border-hairline z-50 transform -translate-x-full md:relative md:translate-x-0 flex flex-col h-full">
        <div class="p-4 border-b border-hairline flex justify-between items-center">
            <button onclick="startNewChat()" class="flex-1 flex items-center gap-2 bg-surface hover:bg-surface2 text-ink py-2.5 px-4 rounded-xl transition-colors border border-hairline">
                <i data-lucide="plus" class="w-4 h-4 text-accent"></i>
                <span class="font-medium text-sm">New Chat</span>
            </button>
            <button onclick="toggleSidebar()" class="md:hidden ml-2 p-2 text-muted hover:text-ink">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-3" id="history-list">
            <!-- Chat history items will populate here -->
        </div>

        <div class="p-4 border-t border-hairline text-xs text-muted text-center tracking-wide">
            AEGIS &middot; Local Storage
        </div>
    </aside>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col h-screen relative min-w-0">

        <!-- Top Navbar -->
        <header class="h-16 flex items-center justify-between px-4 sm:px-6 bg-base/90 backdrop-blur-md border-b border-hairline z-10 shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden p-2 -ml-2 text-muted hover:text-ink rounded-lg">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="w-7 h-7 rounded-full bg-accent/10 flex items-center justify-center text-accent">
                    <i data-lucide="shield" class="w-4 h-4"></i>
                </div>
                <h1 class="text-base font-semibold tracking-wide text-ink">AEGIS</h1>
            </div>

            <button onclick="toggleSettingsModal()" class="p-2 text-muted hover:text-accent rounded-xl hover:bg-surface transition-all" title="Personalization Settings">
                <i data-lucide="settings" class="w-4.5 h-4.5"></i>
            </button>
        </header>

        <!-- Settings Modal -->
        <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-surface border border-hairline rounded-2xl w-full max-w-md p-6 relative shadow-2xl">
                <div class="flex justify-between items-center mb-5 border-b border-hairline pb-3">
                    <h3 class="text-base font-semibold text-ink flex items-center gap-2">
                        <i data-lucide="sliders" class="w-4 h-4 text-accent"></i> Personalization
                    </h3>
                    <button onclick="toggleSettingsModal()" class="text-muted hover:text-ink">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <form id="settings-form" onsubmit="saveUserSettings(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-muted mb-1.5">Your Name</label>
                        <input type="text" id="user-name" placeholder="e.g. Rahul" class="w-full bg-base border border-hairline rounded-xl p-2.5 text-sm text-ink outline-none focus:border-accent/50 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-muted mb-1.5">Profession / Field</label>
                        <input type="text" id="user-profession" placeholder="e.g. Web Developer, Student" class="w-full bg-base border border-hairline rounded-xl p-2.5 text-sm text-ink outline-none focus:border-accent/50 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-muted mb-1.5">About You & Preferences</label>
                        <textarea id="user-about" rows="3" placeholder="e.g. I prefer concise code snippets in Python, simple explanations, and technical depth when asked." class="w-full bg-base border border-hairline rounded-xl p-2.5 text-sm text-ink outline-none focus:border-accent/50 resize-none transition-colors"></textarea>
                    </div>

                    <div class="flex justify-end gap-2 pt-3">
                        <button type="button" onclick="toggleSettingsModal()" class="px-4 py-2 text-sm text-muted hover:text-ink">Cancel</button>
                        <button type="submit" class="px-5 py-2 text-sm bg-accent hover:bg-accentDim text-black font-medium rounded-xl transition-all">Save Settings</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Chat Container -->
        <main id="chat-container" class="flex-1 overflow-y-auto scroll-smooth pb-40 relative">

            <!-- Welcome Message -->
            <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center p-6 animate-fade-in">
                <div class="w-16 h-16 rounded-full bg-accent/10 flex items-center justify-center text-accent mb-6">
                    <i data-lucide="shield-check" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-semibold text-ink mb-2.5" id="welcome-title">Welcome to AEGIS</h2>
                <p class="text-muted max-w-md text-sm sm:text-base">I am ready to assist you. How can I help you today?</p>
            </div>

            <!-- Dynamic Messages Wrapper -->
            <div id="messages-wrapper" class="hidden pb-4"></div>

            <!-- Loading Indicator -->
            <div id="loading-indicator" class="hidden msg-container msg-ai">
                <div class="msg-content">
                    <div class="sender-name sender-ai flex items-center gap-2">AEGIS</div>
                    <div class="flex items-center gap-2 mt-1 text-accent/80 thinking-pulse font-medium text-sm">
                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Thinking&hellip;
                    </div>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-base via-base to-transparent pt-12 pb-6 px-4 md:px-8">
            <!-- Stop Generating Button -->
            <div id="stop-btn-container" class="hidden absolute -top-2 left-1/2 transform -translate-x-1/2 z-20">
                <button onclick="stopGeneration()" class="bg-surface border border-hairline text-ink/80 px-4 py-1.5 rounded-full flex items-center gap-2 text-sm hover:bg-surface2 shadow-lg transition-colors">
                    <i data-lucide="square" class="w-3.5 h-3.5 text-danger fill-danger"></i> Stop Generating
                </button>
            </div>

            <div class="max-w-3xl mx-auto relative">
                <form id="chat-form" class="relative flex items-end gap-2 bg-surface/90 backdrop-blur-md rounded-3xl p-2 input-shell">
                    <textarea
                        id="user-input"
                        rows="1"
                        class="w-full max-h-48 bg-transparent text-ink placeholder-muted p-3 outline-none resize-none overflow-y-auto text-[15px]"
                        placeholder="Ask AEGIS"
                        required
                    ></textarea>

                    <button
                        type="submit"
                        id="send-button"
                        class="p-2.5 rounded-full bg-accent text-black hover:bg-accentDim transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed flex-shrink-0 flex items-center justify-center mb-1 mr-1"
                        title="Send Message"
                    >
                        <i data-lucide="arrow-up" class="w-4.5 h-4.5 font-bold"></i>
                    </button>
                </form>
                <div class="text-center mt-2.5 text-xs text-muted/70">
                    AEGIS can make mistakes. Consider verifying important information.
                </div>
            </div>
        </div>
    </div>

    <script>
    lucide.createIcons();

    const MODEL_URL = "/api/chat";
    const CONTEXT_WINDOW_SIZE = 8;
    const STORAGE_KEY = "aegis_chat_sessions";
    const USER_PROFILE_KEY = "aegis_user_profile";

    let currentAbortController = null;
    let isGenerating = false;

    let chatSessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let activeSessionId = localStorage.getItem('aegis_active_session');

    const ui = {
        form: document.getElementById("chat-form"),
        input: document.getElementById("user-input"),
        sendBtn: document.getElementById("send-button"),
        welcomeScreen: document.getElementById("welcome-screen"),
        welcomeTitle: document.getElementById("welcome-title"),
        messagesWrapper: document.getElementById("messages-wrapper"),
        loadingIndicator: document.getElementById("loading-indicator"),
        chatContainer: document.getElementById("chat-container"),
        stopBtnContainer: document.getElementById("stop-btn-container"),
        sidebar: document.getElementById("sidebar"),
        sidebarOverlay: document.getElementById("sidebar-overlay"),
        historyList: document.getElementById("history-list"),
        settingsModal: document.getElementById("settings-modal")
    };

    // --- PERSONALIZATION SETTINGS ---
    function loadUserSettings() {
        const profile = JSON.parse(localStorage.getItem(USER_PROFILE_KEY)) || {};
        document.getElementById("user-name").value = profile.name || "";
        document.getElementById("user-profession").value = profile.profession || "";
        document.getElementById("user-about").value = profile.about || "";

        if (profile.name) {
            ui.welcomeTitle.innerText = `Welcome back, ${profile.name}`;
        } else {
            ui.welcomeTitle.innerText = "Welcome to AEGIS";
        }
    }

    window.toggleSettingsModal = function() {
        ui.settingsModal.classList.toggle("hidden");
    };

    window.saveUserSettings = function(e) {
        e.preventDefault();
        const profile = {
            name: document.getElementById("user-name").value.trim(),
            profession: document.getElementById("user-profession").value.trim(),
            about: document.getElementById("user-about").value.trim()
        };
        localStorage.setItem(USER_PROFILE_KEY, JSON.stringify(profile));
        loadUserSettings();
        toggleSettingsModal();
    };

    // --- SIDEBAR LOGIC ---
    window.toggleSidebar = function() {
        const isOpen = !ui.sidebar.classList.contains('-translate-x-full');
        if (isOpen) {
            ui.sidebar.classList.add('-translate-x-full');
            ui.sidebarOverlay.classList.add('hidden');
            ui.sidebarOverlay.classList.remove('opacity-100');
        } else {
            ui.sidebar.classList.remove('-translate-x-full');
            ui.sidebarOverlay.classList.remove('hidden');
            setTimeout(() => ui.sidebarOverlay.classList.add('opacity-100'), 10);
        }
    };

    function saveSessions() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chatSessions));
        if(activeSessionId) localStorage.setItem('aegis_active_session', activeSessionId);
        else localStorage.removeItem('aegis_active_session');
    }

    function renderSidebar() {
        ui.historyList.innerHTML = '';
        if(chatSessions.length === 0) {
            ui.historyList.innerHTML = '<div class="text-muted text-sm text-center mt-4">No previous conversations</div>';
            return;
        }

        chatSessions.forEach(session => {
            const btn = document.createElement('div');
            const isActive = session.id === activeSessionId;
            btn.className = `w-full text-left p-3 rounded-xl mb-1 flex items-center justify-between group transition-colors cursor-pointer ${isActive ? 'bg-accent/10 text-accent border border-accent/20' : 'text-ink/80 hover:bg-surface border border-transparent'}`;

            btn.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden flex-1" onclick="loadSession('${session.id}')">
                    <span class="text-sm truncate select-none">${escapeHtml(session.title || 'New Conversation')}</span>
                </div>
                <div class="flex items-center gap-1 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="renameSession(event, '${session.id}')" class="text-muted hover:text-accent p-1 rounded hover:bg-surface2" title="Rename">
                        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                    </button>
                    <button onclick="deleteSession(event, '${session.id}')" class="text-muted hover:text-danger p-1 rounded hover:bg-surface2" title="Delete">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `;
            ui.historyList.appendChild(btn);
        });
        lucide.createIcons({ root: ui.historyList });
    }

    window.renameSession = function(e, sessionId) {
        e.stopPropagation();
        const session = chatSessions.find(s => s.id === sessionId);
        if(!session) return;

        const newTitle = prompt("Enter new name for this chat:", session.title);
        if(newTitle !== null && newTitle.trim() !== "") {
            session.title = newTitle.trim();
            saveSessions();
            renderSidebar();
        }
    };

    window.startNewChat = function() {
        if(window.innerWidth < 768) toggleSidebar();
        activeSessionId = null;
        localStorage.removeItem('aegis_active_session');
        ui.messagesWrapper.innerHTML = "";
        ui.messagesWrapper.classList.add("hidden");
        ui.welcomeScreen.classList.remove("hidden");
        ui.input.value = "";
        ui.input.style.height = "auto";
        ui.input.focus();
        renderSidebar();
    };

    window.loadSession = function(sessionId) {
        if(isGenerating) return;
        if(window.innerWidth < 768) toggleSidebar();

        activeSessionId = sessionId;
        saveSessions();
        renderSidebar();

        const session = chatSessions.find(s => s.id === sessionId);
        if(session) {
            ui.welcomeScreen.classList.add("hidden");
            ui.messagesWrapper.innerHTML = "";
            ui.messagesWrapper.classList.remove("hidden");

            session.messages.forEach((msg, index) => {
                appendMessage(msg.role, msg.parts[0].text, index, false);
            });
            setTimeout(scrollToBottom, 100);
        }
    };

    window.deleteSession = function(e, sessionId) {
        e.stopPropagation();
        if(confirm("Are you sure you want to delete this chat?")) {
            chatSessions = chatSessions.filter(s => s.id !== sessionId);
            if(activeSessionId === sessionId) {
                startNewChat();
            } else {
                saveSessions();
                renderSidebar();
            }
        }
    };

    // --- UTILITIES ---
    function escapeHtml(unsafe) {
        if(!unsafe) return "";
        return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatAndSecureText(text) {
        const rawHtml = marked.parse(text);
        return DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['target'] });
    }

    function applyEnhancements(msgDiv) {
        const markdownBody = msgDiv.querySelector('.markdown-body');
        if(!markdownBody) return;

        // Render Math
        renderMathInElement(markdownBody, {
            delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
                { left: "\\(", right: "\\)", display: false },
                { left: "\\[", right: "\\]", display: true }
            ],
            throwOnError: false
        });

        // Highlight Code & Add Copy Button
        const preTags = markdownBody.querySelectorAll('pre');
        preTags.forEach(pre => {
            if(pre.parentNode.classList.contains('code-block-wrapper')) return;

            const codeEl = pre.querySelector('code');
            if(!codeEl) return;

            const rawCodeText = codeEl.innerText;
            const language = codeEl.className.replace('language-', '') || 'code';

            const wrapper = document.createElement('div');
            wrapper.className = 'code-block-wrapper relative mt-4 mb-4 rounded-xl overflow-hidden border border-hairline shadow-md';

            wrapper.innerHTML = `
                <div class="bg-surface text-muted text-xs px-4 py-2 flex justify-between items-center border-b border-hairline">
                    <span class="font-mono text-muted/80 capitalize">${language}</span>
                    <button class="hover:text-ink transition-colors flex items-center gap-1.5 copy-btn" title="Copy Code">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> <span>Copy</span>
                    </button>
                </div>
                <div class="overflow-x-auto bg-base p-4">
                    <pre class="!m-0 !p-0"><code class="hljs text-sm">${escapeHtml(rawCodeText)}</code></pre>
                </div>
            `;

            pre.parentNode.replaceChild(wrapper, pre);
            const newCode = wrapper.querySelector('code');
            hljs.highlightElement(newCode);

            const copyBtn = wrapper.querySelector('.copy-btn');
            lucide.createIcons({ root: wrapper });
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(rawCodeText).then(() => {
                    copyBtn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-success"></i> <span class="text-success">Copied!</span>`;
                    lucide.createIcons({ root: copyBtn });
                    setTimeout(() => {
                        copyBtn.innerHTML = `<i data-lucide="copy" class="w-3.5 h-3.5"></i> <span>Copy</span>`;
                        lucide.createIcons({ root: copyBtn });
                    }, 2000);
                });
            });
        });
    }

    window.copyMessage = function(button, text) {
        navigator.clipboard.writeText(text).then(() => {
            const icon = button.querySelector('i');
            icon.setAttribute('data-lucide', 'check');
            icon.classList.add('text-success');
            lucide.createIcons({ root: button });
            setTimeout(() => {
                icon.setAttribute('data-lucide', 'copy');
                icon.classList.remove('text-success');
                lucide.createIcons({ root: button });
            }, 2000);
        });
    };

    ui.input.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 200) + "px";
        if (this.value.trim() === "") this.style.height = "auto";
    });

    function scrollToBottom() {
        ui.chatContainer.scrollTo({ top: ui.chatContainer.scrollHeight, behavior: "smooth" });
    }

    // Function to append a message framework
    function appendMessage(role, text, id = null, animate = true) {
        ui.welcomeScreen.classList.add("hidden");
        ui.messagesWrapper.classList.remove("hidden");

        const isUser = role === "user";
        const msgDiv = document.createElement("div");
        msgDiv.className = `msg-container ${isUser ? "msg-user" : "msg-ai"}`;
        if(id !== null) msgDiv.dataset.id = id;

        const senderHeader = isUser ? '' : `<div class="sender-name sender-ai">AEGIS</div>`;

        let actionsHtml = `<div class="msg-actions">`;
        if (isUser) {
            actionsHtml += `<button onclick="editMessage('${id}')" class="text-muted hover:text-accent p-1" title="Edit"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>`;
        } else {
            actionsHtml += `<button onclick="copyMessage(this, \`${escapeHtml(text)}\`)" class="text-muted hover:text-accent p-1" title="Copy"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>`;
            actionsHtml += `<button onclick="regenerateResponse('${id}')" class="text-muted hover:text-accent p-1" title="Regenerate"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i></button>`;
        }
        actionsHtml += `</div>`;

        if (isUser) {
            msgDiv.innerHTML = `
                <div class="msg-content">
                    <div class="bubble">
                        <div class="text-[15px] text-ink markdown-body">${DOMPurify.sanitize(text).replace(/\n/g, "<br>")}</div>
                    </div>
                    ${actionsHtml}
                </div>
            `;
        } else {
            msgDiv.innerHTML = `
                <div class="msg-content">
                    ${senderHeader}
                    <div class="w-full overflow-hidden">
                        <div class="prose prose-invert max-w-none text-[15px] text-ink/90 markdown-body">
                            ${formatAndSecureText(text)}
                        </div>
                        ${actionsHtml}
                    </div>
                </div>
            `;
        }

        ui.messagesWrapper.appendChild(msgDiv);
        lucide.createIcons({ root: msgDiv });

        if (!isUser) {
            applyEnhancements(msgDiv);
        }

        if(animate) scrollToBottom();
        return msgDiv;
    }

    // Simulated Streaming Effect
    async function streamMessageEffect(msgDiv, fullText) {
        const markdownBody = msgDiv.querySelector('.markdown-body');
        markdownBody.innerHTML = '<span class="typing-cursor inline-block w-2 h-4 bg-accent/70 animate-pulse ml-1"></span>';

        let currentText = "";
        const chunkSize = 3;

        for (let i = 0; i < fullText.length; i += chunkSize) {
            if(!isGenerating) break;

            currentText += fullText.substring(i, i + chunkSize);
            markdownBody.innerHTML = formatAndSecureText(currentText) + '<span class="typing-cursor inline-block w-1.5 h-4 bg-accent/70 animate-pulse ml-1 align-middle"></span>';

            if (i % (chunkSize * 10) === 0) scrollToBottom();

            await new Promise(r => setTimeout(r, 15));
        }

        markdownBody.innerHTML = formatAndSecureText(fullText);
        applyEnhancements(msgDiv);
        scrollToBottom();
    }


    // --- CORE LOGIC ---
    window.editMessage = function(id) {
        if(isGenerating) return;
        const msgIndex = parseInt(id);
        const session = chatSessions.find(s => s.id === activeSessionId);
        if(!session) return;

        ui.input.value = session.messages[msgIndex].parts[0].text;
        ui.input.style.height = "auto";
        ui.input.style.height = Math.min(ui.input.scrollHeight, 200) + "px";
        ui.input.focus();
    };

    window.regenerateResponse = function(id) {
        if(isGenerating) return;
        const session = chatSessions.find(s => s.id === activeSessionId);
        if(!session) return;

        const msgIndex = parseInt(id);
        if(msgIndex !== session.messages.length - 1) {
            alert("Only the latest message can be regenerated.");
            return;
        }
        session.messages.pop();
        ui.messagesWrapper.removeChild(ui.messagesWrapper.lastChild);

        const lastUserMsg = session.messages.pop();
        ui.messagesWrapper.removeChild(ui.messagesWrapper.lastChild);
        saveSessions();

        ui.input.value = lastUserMsg.parts[0].text;
        ui.form.dispatchEvent(new Event("submit"));
    };

    window.stopGeneration = function() {
        if (currentAbortController) {
            currentAbortController.abort();
            ui.stopBtnContainer.classList.add('hidden');
            ui.loadingIndicator.classList.add("hidden");
            ui.loadingIndicator.classList.remove("flex");
            isGenerating = false;
            ui.sendBtn.disabled = false;
        }
    };

    async function triggerSend(userText) {
        if (!userText || isGenerating) return;

        isGenerating = true;
        ui.sendBtn.disabled = true;
        ui.stopBtnContainer.classList.remove('hidden');

        if(!activeSessionId) {
            const newSession = {
                id: 'session_' + Date.now(),
                title: userText.substring(0, 30) + (userText.length > 30 ? '...' : ''),
                messages: [],
                updatedAt: Date.now()
            };
            chatSessions.unshift(newSession);
            activeSessionId = newSession.id;
            renderSidebar();
        }

        const session = chatSessions.find(s => s.id === activeSessionId);

        const userMsgId = session.messages.length;
        session.messages.push({ role: "user", parts: [{ text: userText }] });
        session.updatedAt = Date.now();
        saveSessions();
        appendMessage("user", userText, userMsgId);

        ui.loadingIndicator.classList.remove("hidden");
        ui.loadingIndicator.classList.add("flex");
        scrollToBottom();

        const slicedContents = session.messages.slice(-CONTEXT_WINDOW_SIZE);
        const userProfile = JSON.parse(localStorage.getItem(USER_PROFILE_KEY)) || {};

        currentAbortController = new AbortController();

        try {
            const payload = {
                contents: slicedContents,
                userProfile: userProfile
            };

            const response = await fetch(MODEL_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                signal: currentAbortController.signal
            });

            if (!response.ok) {
                const errData = await response.json().catch(()=>({}));
                throw new Error(errData.error || `Server Error (${response.status})`);
            }

            const result = await response.json();
            const aiText = result?.candidates?.[0]?.content?.parts?.[0]?.text || result?.text;

            if (!aiText) throw new Error("Invalid response received.");

            const aiMsgId = session.messages.length;
            session.messages.push({ role: "model", parts: [{ text: aiText }] });
            session.updatedAt = Date.now();
            saveSessions();

            ui.loadingIndicator.classList.add("hidden");
            ui.loadingIndicator.classList.remove("flex");

            const newAiMsgDiv = appendMessage("model", "", aiMsgId, false);
            await streamMessageEffect(newAiMsgDiv, aiText);

        } catch (error) {
            ui.loadingIndicator.classList.add("hidden");
            ui.loadingIndicator.classList.remove("flex");

            if (error.name === 'AbortError') {
                appendMessage("model", "*Generation stopped by user.*");
            } else {
                let friendlyError = `**System Alert:** ${error.message}`;
                if (error.message.includes('429')) friendlyError = "**Rate Limit Hit:** Server is currently busy. Please wait a moment.";
                appendMessage("model", friendlyError);

                session.messages.pop();
                saveSessions();
            }
        } finally {
            isGenerating = false;
            ui.sendBtn.disabled = false;
            ui.stopBtnContainer.classList.add('hidden');
            ui.input.focus();
            currentAbortController = null;
        }
    }

    ui.form.addEventListener("submit", function (e) {
        e.preventDefault();
        const text = ui.input.value.trim();
        ui.input.value = "";
        ui.input.style.height = "auto";
        triggerSend(text);
    });

    // Boot
    loadUserSettings();
    renderSidebar();
    if(activeSessionId) {
        loadSession(activeSessionId);
    }
    </script>
</body>
</html>
